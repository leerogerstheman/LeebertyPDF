            </button>
            <span class="win-controls">

              </button>
              <button class="icon-btn win" id="btn-max" title="最大化/还原" aria-label="最大化">
                <svg viewBox="0 0 12 12" class="ic-sm"><rect x="2.4" y="2.4" width="7.2" height="7.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
              </button>

                <svg viewBox="0 0 12 12" class="ic-sm"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.3"/></svg>
              </button>
            </span>
          </div>
        </div>
        <div class="toolbar" id="toolbar">
          <div class="tb-group">
            <button class="icon-btn" id="btn-open" title="打开 (Ctrl+O)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.4h7A1.5 1.5 0 0 1 19 10v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
            <button class="icon-btn" id="btn-sidebar" title="侧边栏 (F4)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M3.5 5.5h17v13h-17z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9.5 5.5v13" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
          </div>

          <div class="tb-group tb-pager">
            <button class="icon-btn" id="btn-page-prev" title="上一页 (PgUp)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M7 14.5 12 9.5l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <label class="pager" title="跳转到页码 (Ctrl+G)">
              <input id="page-input" class="num-input" type="text" inputmode="numeric" value="1" aria-label="页码" />
              <span class="pager-total" id="page-total">/ 0</span>
            </label>
            <button class="icon-btn" id="btn-page-next" title="下一页 (PgDn)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M7 9.5 12 14.5l5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="tb-sep"></span>
            <button class="icon-btn" id="btn-zoom-out" title="缩小 (Ctrl+-)">
              <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.4 11h5.2M15.6 15.6 21 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="tb-text" id="btn-zoom" title="缩放 (Ctrl+滚轮)">100%</button>
            <button class="icon-btn" id="btn-zoom-in" title="放大 (Ctrl+=)">
              <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.4 11h5.2M11 8.4v5.2M15.6 15.6 21 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>

          <div class="tb-spacer"></div>

          <div class="tb-group">
            <button class="icon-btn" id="btn-rotate-ccw" title="逆时针旋转 (Ctrl+Shift+R)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M4 10a8 8 0 1 1 2.6 8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 5.6V10h4.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="icon-btn" id="btn-rotate-cw" title="顺时针旋转 (Ctrl+R)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M20 10a8 8 0 1 0-2.6 8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M20 5.6V10h-4.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <span class="tb-sep"></span>
            <button class="icon-btn" id="btn-highlight" title="高亮 (Ctrl+H)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M5 18h4l10-10-4-4L5 14z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3.5 20.5h17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="icon-btn" id="btn-ink" title="自由绘制 (Ctrl+D)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M4 20l3.4-1 10-10a2.1 2.1 0 0 0-3-3l-10 10z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-btn" id="btn-erase" title="擦除批注 (E)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M8 19h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M5.5 15.5 12 9l5.5 5.5-4 4H9.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-btn" id="btn-hand" title="手形工具 (H) — 拖拽平移">
              <svg viewBox="0 0 24 24" class="ic"><path d="M8 12V6.6a1.3 1.3 0 0 1 2.6 0V11m0 0V5.4a1.3 1.3 0 0 1 2.6 0V11m0 0V6.6a1.3 1.3 0 0 1 2.6 0V13c0 4-2.2 7-5.6 7S7 17.4 7 14.4v-1.9a1.3 1.3 0 0 1 2.6 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <span class="tb-sep"></span>
            <button class="icon-btn" id="btn-reflow" title="重排阅读 — 图文重排为单栏 (Ctrl+Shift+E)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 10.5h12M4 15h16M4 19.5h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="icon-btn" id="btn-find" title="查找 (Ctrl+F)">
              <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M15.6 15.6 21 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="icon-btn" id="btn-view" title="视图与工具">
              <svg viewBox="0 0 24 24" class="ic"><circle cx="5.5" cy="12" r="1.35" fill="currentColor"/><circle cx="12" cy="12" r="1.35" fill="currentColor"/><circle cx="18.5" cy="12" r="1.35" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <div class="findbar" id="findbar" hidden>
          <div class="findbar-inner">
            <input id="find-input" class="find-input" type="text" placeholder="查找" aria-label="查找" />
            <span class="find-counter" id="find-counter">0/0</span>
            <button class="icon-btn sm" id="find-prev" title="上一个 (Shift+Enter)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M7 14.5 12 9.5l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-btn sm" id="find-next" title="下一个 (Enter)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M7 9.5 12 14.5l5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="tb-sep"></span>
            <button class="toggle-chip" id="find-case" title="区分大小写">Aa</button>
            <button class="toggle-chip" id="find-word" title="全字匹配">词</button>
            <button class="toggle-chip" id="find-diacritics" title="区分变音符号">á</button>
            <button class="toggle-chip" id="find-highlightall" title="全部高亮">全部</button>
            <span class="tb-sep"></span>
            <button class="toggle-chip" id="find-results-toggle" title="结果列表">列表</button>
            <button class="icon-btn sm" id="find-close" title="关闭 (Esc)">
              <svg viewBox="0 0 24 24" class="ic"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="find-results" id="find-results" hidden></div>
        </div>

            <button class="sidebar-tab active" data-pane="thumbnails" role="tab">缩略图</button>
            <button class="sidebar-tab" data-pane="outline" role="tab">目录</button>
            <button class="sidebar-tab" data-pane="bookmarks" role="tab">书签</button>
            <button class="sidebar-tab" data-pane="annotations" role="tab">批注</button>
          </div>
          <div class="sidebar-body">
            <div class="pane" id="pane-thumbnails">
              <div class="thumb-scroll" id="thumb-list"></div>
            </div>
            <div class="pane" id="pane-outline" hidden>
              <div class="outline-scroll" id="outline-list"></div>
            </div>
            <div class="pane" id="pane-bookmarks" hidden>
              <div class="outline-scroll" id="bookmark-list"></div>
            </div>
            <div class="pane" id="pane-annotations" hidden>
              <div class="outline-scroll" id="annot-list"></div>
            </div>
          </div>
        </aside>
        <div class="sidebar-resizer" id="sidebar-resizer" hidden></div>

        <main class="stage" id="stage">
          <div class="viewers" id="viewers">
            <div class="empty-state" id="empty-state">
              <div class="empty-card">
                <div class="empty-logo">Leeberty<span>PDF</span></div>
                <p class="empty-sub">把 PDF 拖进来</p>
                <div class="empty-actions">
                  <button class="btn" id="empty-open">打开文件</button>
                  <button class="btn" id="empty-folder">打开文件夹</button>
                  <button class="btn" id="empty-recent">最近阅读</button>
                </div>
                <div class="empty-recent" id="empty-recent-list"></div>
              </div>
            </div>
          </div>
          <div class="statusline" id="statusline">
            <span class="status-item" id="status-progress" hidden>
              <span class="mini-spinner"></span><span id="status-progress-text"></span>
            </span>
            <span class="status-item" id="status-message"></span>
            <span class="status-spacer"></span>
            <span class="status-item" id="status-hint"></span>
          </div>
          <div class="progress-line" id="progress-line"><span id="progress-fill"></span></div>
        </main>
      </div>
    </div>

    <!-- floating layers -->
    <div class="menu-popover" id="main-menu" hidden></div>
    <div class="palette" id="palette" hidden>
      <div class="palette-box">
        <input id="palette-input" class="palette-input" type="text" placeholder="输入命令或文件名…" />
        <div class="palette-list" id="palette-list"></div>
        <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 执行</span><span><kbd>Esc</kbd> 关闭</span></div>
      </div>
    </div>
    <div class="toasts" id="toasts"></div>
    <div class="modal-root" id="modal-root" hidden></div>
    <div class="context-menu" id="context-menu" hidden></div>
    <div class="drop-overlay" id="drop-overlay" hidden><div class="drop-inner">松开鼠标以打开 PDF</div></div>
    <div class="editor-bar" id="editor-bar" hidden>
      <span class="editor-label">批注</span>
      <div class="swatches" id="editor-colors"></div>
      <label class="editor-size">
        粗细
        <input type="range" id="editor-thickness" min="1" max="24" step="1" value="2" class="range" />
      </label>
      <label class="editor-size">
        字号
        <input type="range" id="editor-fontsize" min="8" max="72" step="1" value="16" class="range" />
      </label>
      <button class="chip-btn" id="editor-done">完成</button>
      <button class="chip-btn" id="editor-delete" title="删除选中的批注">删除选中</button>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
